---
- name: Configura servidor para rodar API Animes (Node.js + Docker)
  hosts: servidor
  become: yes

  vars:
    docker_image: "SEU_USUARIO/api-animes:latest"
    container_name: "api-animes"
    app_port: 3000

  tasks:

    - name: Atualiza pacotes do sistema
      apt:
        update_cache: yes

    - name: Instala dependências necessárias
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Adiciona chave GPG do Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Adiciona repositório Docker
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: Instala Docker
      apt:
        name: docker-ce
        state: present
        update_cache: yes

    - name: Instala Docker Compose
      get_url:
        url: https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Faz pull da imagem da API no DockerHub
      community.docker.docker_image:
        name: "{{ docker_image }}"
        source: pull

    - name: Remove container antigo da API (se existir)
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent
        force_kill: yes

    - name: Sobe container da API
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ docker_image }}"
        restart_policy: always
        published_ports:
          - "{{ app_port }}:3000"
        state: started
